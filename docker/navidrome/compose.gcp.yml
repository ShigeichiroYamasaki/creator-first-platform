version: "3.8"

services:
  navidrome-data-init:
    image: deluan/navidrome:0.63.2
    user: "0:0"
    entrypoint: ["chown", "-R"]
    command: ["1000:1000", "/data"]
    volumes:
      - navidrome-data:/data
    network_mode: none
    restart: "no"
    security_opt:
      - no-new-privileges:true

  navidrome:
    image: deluan/navidrome:0.63.2
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      navidrome-data-init:
        condition: service_completed_successfully
    environment:
      ND_LOGLEVEL: info
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANNER_SCANONSTARTUP: "true"
      ND_SCANNER_SCHEDULE: "@every 1m"
      ND_ENABLEDOWNLOADS: "false"
      ND_ENABLESHARING: "false"
      ND_ENABLEEXTERNALSERVICES: "false"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLELOGREDACTING: "true"
      ND_ENABLEUSEREDITING: "false"
      ND_EXTAUTH_TRUSTEDSOURCES: 172.31.0.10/32
      ND_EXTAUTH_USERHEADER: Remote-User
    volumes:
      - navidrome-data:/data
      - ./music:/music:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4533/"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    networks:
      media:
        ipv4_address: 172.31.0.20

  docs-demo:
    image: nginx:1.29-alpine
    restart: unless-stopped
    read_only: true
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./bootstrap/docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/creator-first-platform/demo/"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    networks:
      media:
        ipv4_address: 172.31.0.30

  gateway-data-init:
    image: node:24-alpine
    user: "0:0"
    entrypoint: ["chown", "-R"]
    command: ["1000:1000", "/data"]
    volumes:
      - gateway-data:/data
    network_mode: none
    restart: "no"
    security_opt:
      - no-new-privileges:true

  participant-gateway:
    image: creator-first-gateway:deployment
    restart: unless-stopped
    depends_on:
      gateway-data-init:
        condition: service_completed_successfully
    env_file:
      - ./bootstrap/gateway.env
    volumes:
      - gateway-data:/data
      - ./music:/music:ro
      - ./secrets:/run/secrets:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "polygon-amoy.drpc.org:172.31.0.1"
      - "polygon-amoy-bor-rpc.publicnode.com:172.31.0.1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      # The public health response verifies the Amoy role and Test POL balance
      # of both relayers. Allow for the bounded 20-second RPC failover on the
      # e2-micro VM instead of killing that check after three seconds.
      interval: 10s
      timeout: 45s
      retries: 12
      start_period: 20s
    networks:
      media:
        ipv4_address: 172.31.0.40

  bootstrap-gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      navidrome:
        condition: service_healthy
      docs-demo:
        condition: service_healthy
      participant-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./bootstrap/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./bootstrap/.htpasswd:/etc/nginx/.htpasswd:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      media:
        ipv4_address: 172.31.0.10

  public-gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      bootstrap-gateway:
        condition: service_started
    network_mode: host
    volumes:
      - ./bootstrap/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  navidrome-data:
  gateway-data:
  caddy-data:
  caddy-config:

networks:
  media:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
