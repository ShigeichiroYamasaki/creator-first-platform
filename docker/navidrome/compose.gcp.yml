version: "3.8"

services:
  navidrome-data-init:
    image: deluan/navidrome:0.63.2
    user: "0:0"
    entrypoint: ["chown", "-R"]
    command: ["1000:1000", "/data"]
    volumes:
      - navidrome-data:/data
    network_mode: none
    restart: "no"
    security_opt:
      - no-new-privileges:true

  navidrome:
    image: deluan/navidrome:0.63.2
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      navidrome-data-init:
        condition: service_completed_successfully
    environment:
      ND_LOGLEVEL: info
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANNER_SCANONSTARTUP: "true"
      ND_SCANNER_SCHEDULE: "@every 1m"
      ND_ENABLEDOWNLOADS: "false"
      ND_ENABLESHARING: "false"
      ND_ENABLEEXTERNALSERVICES: "false"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLELOGREDACTING: "true"
      ND_ENABLEUSEREDITING: "false"
      ND_EXTAUTH_TRUSTEDSOURCES: 172.31.0.10/32
      ND_EXTAUTH_USERHEADER: Remote-User
    volumes:
      - navidrome-data:/data
      - ./music:/music:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4533/"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    networks:
      media:
        ipv4_address: 172.31.0.20

  bootstrap-gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      navidrome:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./bootstrap/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./bootstrap/.htpasswd:/etc/nginx/.htpasswd:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      media:
        ipv4_address: 172.31.0.10

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - bootstrap-gateway
    network_mode: host
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://127.0.0.1:8080
    security_opt:
      - no-new-privileges:true

volumes:
  navidrome-data:

networks:
  media:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
