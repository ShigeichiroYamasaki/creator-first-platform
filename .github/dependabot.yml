version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      documentation-tooling:
        patterns:
          - "vitepress*"
          - "vite*"
          - "vue"
          - "mermaid"
          - "markdown-it-mathjax3"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
