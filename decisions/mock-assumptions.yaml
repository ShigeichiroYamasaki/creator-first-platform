schema_version: 0.1.0
status: DRAFT

# Mock assumptions are explicit, bounded substitutes for unresolved decisions.
assumptions:
  - id: MOCK-ASSUMPTION-002
    state: ACTIVE
    scope:
      - IMP-007
      - IMP-010
    source_questions:
      - OQ-ZK-001
      - OQ-ZK-002
      - OQ-ZK-003
    value: >-
      The testnet transparent-ZK boundary uses a deterministic digest-comparison
      verifier only to exercise verifier-profile registration, chain-bound receipt
      identity, replay rejection, deprecation, pause and events. It provides no
      zero-knowledge, soundness, Usage, Rights, eligibility or Distribution claim.
    expires_when: >-
      The approved transparent proof system, statement program, verifier, public
      inputs, mainnet path and independent audits satisfy SPEC-ZK-001 mainnet acceptance.
    prohibited_uses:
      - Claiming cryptographic zero knowledge, proof soundness or independent audit
      - Consuming a mock receipt for real Usage, Rights, eligibility, Distribution or funds
      - Copying Polygon Amoy profiles, keys, addresses, receipts or bootstrap roles to mainnet
      - Presenting testnet integration success as production readiness
  - id: MOCK-ASSUMPTION-001
    state: ACTIVE
    scope:
      - IMP-003
      - IMP-006
    source_questions:
      - OQ-PLAYER-001
      - OQ-PLAYER-002
      - OQ-PLAYER-006
      - OQ-ACCOUNT-LIFECYCLE-001
      - OQ-ACCOUNT-LIFECYCLE-002
      - OQ-STREAMING-001
      - OQ-STREAMING-003
      - OQ-STREAMING-004
      - OQ-STREAMING-008
    value: >-
      The local Player MVP uses Vue 3 and TypeScript, one browser Audio element,
      an external EIP-1193 Wallet and synthetic audio. The local Gateway MVP uses
      Node.js 24, a same-origin HTTP boundary, a five-minute single-stream Playback
      Session, an 800 MiB monthly demo limit, SQLite evidence, a fixed active Mock
      Subscription and Rights Snapshot, an in-memory Mock Supporter Credential,
      a bounded File adapter and an optional explicitly mapped Navidrome adapter.
      Test User registration creates only an ephemeral alias profile and opaque
      test identifier bound to the local Gateway Session; it collects no email,
      phone number, password, legal name or production authenticator. It does not
      create or activate a Platform Account and is never an authorization input for
      playback, Wallet Link, Subscription, Credential or Community capability. The
      hosted documentation demo is a separate browser-only UI simulation that keeps
      its alias profile in per-tab Session Storage and never calls the Gateway. The
      hosted Creator fixture keeps a synthetic Creator Profile in per-tab Session
      Storage. Its public Testnet Journey may connect an explicitly selected Wallet to
      Polygon Amoy and submit salted profile, release-metadata and unverified-rights
      commitments to the reviewed Creator Registry address from the same-origin
      deployment manifest. It never uploads media or evidence, verifies identity or
      rights, publishes a release, calculates distribution, authorizes a Treasury
      payment or calls the Gateway. The Treasury
      Transparency fixture uses fixed MockJPYC period flows, asset locations and
      purpose-or-obligation balances only to demonstrate two-stage reconciliation.
      It reads no Contract, Wallet, bank, accounting or tax data and cannot authorize
      distribution, payment or budget execution.
    expires_when: >-
      The owning Product, Security, Accessibility, Privacy, Rights and Protocol
      decision owners approve the first Account, Player, Wallet and Community profile.
    prohibited_uses:
      - Production deployment or a claim that the Player stack is finally approved
      - Real JPYC, production Wallet keys, real SBT issuance or valuable privileges
      - Direct Navidrome or arbitrary upstream access from the public Player
      - Rights-cleared music distribution, offline protected audio or verified usage
      - Production use of the fixed Subscription, Rights, TTL, byte budget or SQLite choices
      - Claiming that a Test User is an ACTIVE Platform Account or verified person
      - Claiming that a Test Creator is verified, owns rights, has published a release or can receive payment
      - Treating a Creator or Release commitment as Identity, Rights, Payee, Catalog, Streaming or Settlement authorization
      - Claiming that Treasury fixture values are real assets, revenue, liabilities, statutory accounts, tax results or authority to spend
